services:
  moodle-php-fpm:
    # profiles: [moodle]
    image: prof_php_fpm:latest
    restart: always
    deploy:
      replicas: 1
    networks:
    - moodle-overlay
    volumes:
      - type: bind
        source: ./moodle/nginx/php_fpm/www.conf
        target: /usr/local/etc/php_fpm.d/www.conf
        read_only: true
      - type: bind
        source: ./moodle/source/moodle
        target: /web/moodle
      - type: bind
        source: ./moodle/moodledata
        target: /var/lib/moodle/moodledata
      - type: bind
        source: ./moodle/nginx/php_fpm/php.ini-production
        target: /usr/local/etc/php/php.ini
        read_only: true

  moodle-nginx:
    # profiles: [moodle]
    image: nginx:latest
    restart: always
    deploy:
      replicas: 1
    depends_on:
      - moodle-php-fpm
    volumes:
      - type: bind
        source: ./moodle/nginx/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./moodle/source/moodle
        target: /web/moodle
        read_only: true
      - type: bind
        source: ./moodle/moodledata
        target: /var/lib/moodle/moodledata
    networks:
    - moodle-overlay
    - lb-overlay

  db:
    image: postgres:18.1
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    command: "-c config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - type: volume
        source: prof-db-data
        target: "/var/lib/postgresql"
        volume:
          nocopy: true
      - type: bind
        source: ./postgres.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: root
      POSTGRES_PASSWORD_FILE: /run/secrets/prof-postgresdb-superuser-password
      PGDATA: /var/lib/postgresql/18/docker
      # init script that makes additional read user for BE and read write user for update Job
    networks:
    - db-overlay
    - moodle-overlay
    secrets:
      - prof-postgresdb-superuser-password
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: "10s"
      timeout: "5s"
      retries: 5

  adminer:
    image: adminer
    restart: always
    depends_on:
      - db
    ports:
     - 5433:8080
    networks:
    - db-overlay
    - lb-overlay

  nginx-proxy:
    image: nginx:latest
    restart: always
    deploy:
      replicas: 1
    depends_on:
      - moodle-nginx
      - adminer
    ports:
    - 8998:80
    volumes:
      - type: bind
        source: ./nginx_lb.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks:
    - lb-overlay

networks:
  moodle-overlay:
    driver: overlay
  lb-overlay:
    driver: overlay
  db-overlay:
    driver: overlay

volumes:
  prof-db-data:

secrets:
  prof-postgresdb-superuser-password:
    external: true