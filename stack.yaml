services:
  moodle-php-fpm:
    # profiles: [moodle]
    image: prof_php_fpm:latest
    restart: always
    deploy:
      replicas: 1
    networks:
      - moodle-overlay
    depends_on:
      - db
    volumes:
      - type: bind
        source: ./moodle/nginx/php_fpm/www.conf
        target: /usr/local/etc/php_fpm.d/www.conf
        read_only: true
      - type: bind
        source: ./moodle/source/moodle
        target: /web/moodle
      - type: bind
        source: ./moodle/moodledata
        target: /var/lib/moodle/moodledata
      - type: bind
        source: ./moodle/nginx/php_fpm/php.ini-production
        target: /usr/local/etc/php/php.ini
        read_only: true

  moodle-nginx:
    # profiles: [moodle]
    image: nginx:latest
    restart: always
    deploy:
      replicas: 1
    depends_on:
      - moodle-php-fpm
    ports:
      - 9001:80
    volumes:
      - type: bind
        source: ./moodle/nginx/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
      - type: bind
        source: ./moodle/source/moodle
        target: /web/moodle
        read_only: true
      - type: bind
        source: ./moodle/moodledata
        target: /var/lib/moodle/moodledata
    networks:
      - moodle-overlay

  db:
    image: postgres:18.1
    restart: always
    shm_size: 128mb
    command: "-c config_file=/etc/postgresql/postgresql.conf"
    volumes:
      - type: volume
        source: prof-db-data
        target: "/var/lib/postgresql"
        volume:
          nocopy: true
      - type: bind
        source: ./postgres.conf
        target: /etc/postgresql/postgresql.conf
        read_only: true
    environment:
      POSTGRES_USER: root
      POSTGRES_DB: root
      POSTGRES_PASSWORD_FILE: /run/secrets/prof-postgresdb-superuser-password
      PGDATA: /var/lib/postgresql/18/docker
    networks:
      - moodle-overlay
    secrets:
      - prof-postgresdb-superuser-password
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: "10s"
      timeout: "5s"
      retries: 5

  adminer:
    image: adminer
    restart: always
    depends_on:
      - db
    ports:
     - 5433:8080
    networks:
      - moodle-overlay

  fastapi-server:
    image: profesorat_lectii_fastapi_server:latest
    restart: always
    ports:
     - 9002:80

  react-ui:
    image: profesorat_lectii_react_ui:latest
    restart: always
    ports:
     - 9003:80

networks:
  moodle-overlay:
    driver: overlay

volumes:
  prof-db-data:

secrets:
  prof-postgresdb-superuser-password:
    external: true
